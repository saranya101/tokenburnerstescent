name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PARLANCE_MOBILE_PUBLIC_API_URL: https://tokenburnerstescent-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parlance/contracts build
      - run: pnpm --filter @parlance/mobile typecheck && pnpm --filter @parlance/mobile test
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: pnpm --filter @parlance/mobile prebuild
      - run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: parlance-android-email-login
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Redis is disposable coordination infrastructure. Never infer financial truth from it.
